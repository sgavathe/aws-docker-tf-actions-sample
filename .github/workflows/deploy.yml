name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC -> AWS role assumption
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: geo-devops-demo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tags
        id: vars
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$PROJECT_NAME-backend:${{ steps.vars.outputs.sha }} ./backend
          docker push $REGISTRY/$PROJECT_NAME-backend:${{ steps.vars.outputs.sha }}

      - name: Build and push frontend image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$PROJECT_NAME-frontend:${{ steps.vars.outputs.sha }} ./frontend
          docker push $REGISTRY/$PROJECT_NAME-frontend:${{ steps.vars.outputs.sha }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform apply
        working-directory: infra
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          terraform init
          terraform apply -auto-approve \
            -var="backend_image=$REGISTRY/$PROJECT_NAME-backend:${{ steps.vars.outputs.sha }}" \
            -var="frontend_image=$REGISTRY/$PROJECT_NAME-frontend:${{ steps.vars.outputs.sha }}"
