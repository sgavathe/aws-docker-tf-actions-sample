name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC -> AWS role assumption
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: geo-devops-demo

jobs:
  # ---- Stage 1: plan + policy gate, no changes made ----
  plan:
    # Skipped on push when the repo variable DEPLOY_TARGET = "serverless" (see
    # serverless/README.md); later jobs need this one, so they skip too.
    # Manual runs always deploy ECS - that's how you switch back.
    if: github.event_name == 'workflow_dispatch' || vars.DEPLOY_TARGET != 'serverless'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        run: |
          BE=$(aws ecs describe-task-definition --task-definition $PROJECT_NAME-backend  --query 'taskDefinition.containerDefinitions[0].image' --output text 2>/dev/null || echo "")
          FE=$(aws ecs describe-task-definition --task-definition $PROJECT_NAME-frontend --query 'taskDefinition.containerDefinitions[0].image' --output text 2>/dev/null || echo "")
          terraform plan -input=false -out=tfplan -var="backend_image=$BE" -var="frontend_image=$FE"
          terraform show -json tfplan > tfplan.json

      - name: OPA policy check (Conftest)
        run: |
          VERSION=0.59.0
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}/conftest_${VERSION}_Linux_x86_64.tar.gz" | tar xz conftest
          ./conftest test tfplan.json -p ../policy/

  # ---- Stage 2: build/push backend image, APPLY backend service + shared infra ----
  deploy-backend:
    needs: plan
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      backend_image: ${{ steps.image.outputs.backend_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Ensure backend ECR repo exists
        working-directory: infra
        run: terraform apply -auto-approve -target=aws_ecr_repository.backend

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$PROJECT_NAME-backend:${{ steps.vars.outputs.sha }}"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "backend_image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Terraform apply - backend service (creates shared infra + backend ECS service)
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -target=aws_ecs_service.backend \
            -var="backend_image=${{ steps.image.outputs.backend_image }}"

  # ---- Stage 3: build/push frontend image, APPLY everything, smoke test ----
  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Ensure frontend ECR repo exists
        working-directory: infra
        run: terraform apply -auto-approve -target=aws_ecr_repository.frontend

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$PROJECT_NAME-frontend:${{ needs.deploy-backend.outputs.sha }}"
          docker build -t "$IMAGE" ./frontend
          docker push "$IMAGE"
          echo "frontend_image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Terraform apply - frontend service + full convergence
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -var="backend_image=${{ needs.deploy-backend.outputs.backend_image }}" \
            -var="frontend_image=${{ steps.image.outputs.frontend_image }}"

      - name: Smoke test
        run: |
          set -e
          curl -fsS --retry 5 --retry-delay 10 https://map.spatialenable.com/health
          curl -fsS https://map.spatialenable.com/api/ports > /dev/null
          code=$(curl -s -o /dev/null -w '%{http_code}' http://map.spatialenable.com)
          [ "$code" = "301" ] || { echo "Expected 301 redirect, got $code"; exit 1; }
          echo "Smoke test passed"