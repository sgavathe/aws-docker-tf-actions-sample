name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write   # required for OIDC -> AWS role assumption
  contents: read

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: geo-devops-demo

jobs:
  # ---- Stage 1: show what Terraform intends to do, no changes made ----
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug OIDC token claims
        run: |
          IDTOKEN=$(curl -sSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$IDTOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq .

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Terraform plan
        working-directory: infra
        run: terraform plan

  # ---- Stage 2: build/push the backend image, deploy backend ECS service
  #      (this also creates all shared infra: VPC, ALB, cluster, IAM, since
  #      -target pulls in whatever aws_ecs_service.backend depends on) ----
  deploy-backend:
    needs: plan
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.vars.outputs.sha }}
      backend_image: ${{ steps.image.outputs.backend_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Ensure backend ECR repo exists
        working-directory: infra
        run: terraform apply -auto-approve -target=aws_ecr_repository.backend

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: echo "sha=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$PROJECT_NAME-backend:${{ steps.vars.outputs.sha }}"
          docker build -t "$IMAGE" ./backend
          docker push "$IMAGE"
          echo "backend_image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy backend service (creates shared infra + backend ECS service)
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -target=aws_ecs_service.backend \
            -var="backend_image=${{ steps.image.outputs.backend_image }}"

  # ---- Stage 3: build/push the frontend image, deploy frontend ECS service
  #      (shared infra already exists from stage 2, so this only adds the
  #      frontend-specific resources) ----
  deploy-frontend:
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Ensure frontend ECR repo exists
        working-directory: infra
        run: terraform apply -auto-approve -target=aws_ecr_repository.frontend

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend image
        id: image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="$REGISTRY/$PROJECT_NAME-frontend:${{ needs.deploy-backend.outputs.sha }}"
          docker build -t "$IMAGE" ./frontend
          docker push "$IMAGE"
          echo "frontend_image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Deploy frontend service + full convergence apply
        working-directory: infra
        run: |
          terraform apply -auto-approve \
            -var="backend_image=${{ needs.deploy-backend.outputs.backend_image }}" \
            -var="frontend_image=${{ steps.image.outputs.frontend_image }}"
