name: PR Checks

# No path filter: build-test and plan are required checks, and a required check that
# never starts blocks the PR forever.
on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Backend unit tests
        run: dotnet test tests/Backend.Tests

      - name: Build backend image
        run: docker build ./backend

      - name: Build frontend image
        run: docker build ./frontend

  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.0"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: |
          BE=$(aws ecs describe-task-definition --task-definition geo-devops-demo-backend  --query 'taskDefinition.containerDefinitions[0].image' --output text 2>/dev/null || echo "")
          FE=$(aws ecs describe-task-definition --task-definition geo-devops-demo-frontend --query 'taskDefinition.containerDefinitions[0].image' --output text 2>/dev/null || echo "")
          echo "Planning with backend=$BE frontend=$FE"
          terraform plan -input=false -out=tfplan -var="backend_image=$BE" -var="frontend_image=$FE"
          terraform show -json tfplan > tfplan.json

      - name: OPA policy check (Conftest)
        run: |
          VERSION=0.59.0
          curl -sSL "https://github.com/open-policy-agent/conftest/releases/download/v${VERSION}/conftest_${VERSION}_Linux_x86_64.tar.gz" | tar xz conftest
          ./conftest test tfplan.json -p ../policy/