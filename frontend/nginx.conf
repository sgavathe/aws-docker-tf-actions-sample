server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config and the HTML shell must never be cached, or a new
    # deployment / API_BASE_URL change won't be picked up by browsers.
    location = /env.js     { add_header Cache-Control "no-store"; }
    location = /index.html { add_header Cache-Control "no-cache"; }

    # Vite emits content-hashed file names, so these can be cached forever.
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }

    location / { try_files $uri $uri/ /index.html; }
}
