<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Grid Cascade: three linked nodes, one failed (red) passing the failure on -->
  <rect width="64" height="64" rx="14" fill="#0f2a44"/>
  <g stroke="#9fb6cc" stroke-width="4" stroke-linecap="round">
    <line x1="18" y1="20" x2="44" y2="20"/>
    <line x1="18" y1="20" x2="32" y2="44"/>
  </g>
  <line x1="44" y1="20" x2="32" y2="44" stroke="#e8394a" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 7"/>
  <circle cx="18" cy="20" r="7" fill="#ffffff"/>
  <circle cx="32" cy="44" r="7" fill="#ffffff"/>
  <circle cx="44" cy="20" r="8" fill="#e8394a" stroke="#0f2a44" stroke-width="2"/>
</svg>
