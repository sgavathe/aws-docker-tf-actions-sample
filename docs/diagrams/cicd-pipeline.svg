<svg width="680" height="400" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg" role="img">
<title>CI/CD pipeline from git push to AWS deployment</title>
<desc>A developer pushes code to GitHub, which triggers GitHub Actions. The workflow requests an OIDC token, exchanges it with AWS STS to assume an IAM role with no stored credentials, then uses that role to build and push Docker images to ECR and run Terraform.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="400" fill="#ffffff"/>

<rect x="250" y="20" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">git push to main</text>
<line x1="340" y1="64" x2="340" y2="100" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="220" y="100" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">GitHub Actions workflow</text>
<text x="340" y="136" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">plan, deploy-backend, deploy-frontend</text>
<line x1="340" y1="156" x2="340" y2="192" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="200" y="192" width="280" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="210" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">OIDC token exchanged with AWS STS</text>
<text x="340" y="228" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">no stored AWS credentials</text>
<line x1="340" y1="248" x2="340" y2="284" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="220" y="284" width="240" height="44" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="306" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">IAM role assumed</text>

<line x1="260" y1="328" x2="180" y2="356" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="420" y1="328" x2="500" y2="356" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="50" y="356" width="180" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="140" y="374" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#04342C">Build and push to ECR</text>
<rect x="450" y="356" width="180" height="36" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="540" y="374" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#04342C">terraform apply</text>
</svg>
