<svg width="680" height="440" viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" role="img">
<title>AWS runtime architecture inside the VPC</title>
<desc>A browser request to map.spatialenable.com resolves via Route 53 to an Application Load Balancer, which terminates HTTPS and routes by path to two ECS Fargate services running inside a VPC: a frontend Angular container and a backend .NET API container.</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="440" fill="#ffffff"/>

<rect x="250" y="20" width="180" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="42" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">map.spatialenable.com</text>
<line x1="340" y1="64" x2="340" y2="96" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>

<rect x="230" y="96" width="220" height="52" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="340" y="114" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Application load balancer</text>
<text x="340" y="132" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">HTTPS listener, ACM cert</text>

<line x1="290" y1="148" x2="200" y2="184" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
<line x1="390" y1="148" x2="480" y2="184" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow2)"/>
<text x="205" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">"/*"</text>
<text x="475" y="172" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">"/api/*"</text>

<rect x="60" y="184" width="560" height="220" rx="20" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="80" y="210" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#173404">VPC</text>
<text x="80" y="228" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#27500A">ECS Fargate cluster</text>

<rect x="90" y="250" width="230" height="120" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="205" y="280" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Frontend target group</text>
<text x="205" y="300" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">Fargate task, nginx</text>
<text x="205" y="318" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">Angular + ArcGIS SDK</text>

<rect x="360" y="250" width="230" height="120" rx="12" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="475" y="280" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">Backend target group</text>
<text x="475" y="300" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">Fargate task, port 8080</text>
<text x="475" y="318" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">.NET minimal API</text>
</svg>
