<svg width="680" height="360" viewBox="0 0 680 360" xmlns="http://www.w3.org/2000/svg" role="img">
<title>How ECS Fargate wires task definitions to running Docker containers</title>
<desc>An ECS cluster on the Fargate launch type has no visible EC2 instances. Each service references a task definition, which points at a Docker image in ECR. AWS manages the underlying compute invisibly.</desc>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect width="680" height="360" fill="#ffffff"/>

<rect x="40" y="20" width="600" height="300" rx="20" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<text x="60" y="46" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#173404">ECS cluster, launch type: Fargate</text>
<text x="60" y="64" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#27500A">no EC2 instances registered</text>

<rect x="70" y="86" width="260" height="210" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="200" y="110" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Backend service</text>

<rect x="90" y="130" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="200" y="148" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Task definition</text>
<text x="200" y="166" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">cpu, memory, port 8080</text>
<line x1="200" y1="186" x2="200" y2="220" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow3)"/>

<rect x="90" y="220" width="220" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="200" y="238" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">Docker image</text>
<text x="200" y="256" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">pulled from ECR</text>

<rect x="350" y="86" width="260" height="210" rx="12" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="480" y="110" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Frontend service</text>

<rect x="370" y="130" width="220" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="480" y="148" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#042C53">Task definition</text>
<text x="480" y="166" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0C447C">cpu, memory, port 80</text>
<line x1="480" y1="186" x2="480" y2="220" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow3)"/>

<rect x="370" y="220" width="220" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="480" y="238" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">Docker image</text>
<text x="480" y="256" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">pulled from ECR</text>
</svg>
